plugins {
    id 'com.android.application'
}

def debugSignalingUrl = providers.gradleProperty('debugSignalingUrl')
    .orElse('ws://10.0.2.2:8000/')
def releaseSignalingUrl = providers.gradleProperty('releaseSignalingUrl')
    .orElse('REPLACE_WITH_PRODUCTION_WSS_URL')

android {
    namespace = 'com.example.kotlinhelloworld'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.example.kotlinhelloworld'
        minSdk = 23
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'SIGNALING_SERVER_URL',
                groovy.json.JsonOutput.toJson(debugSignalingUrl.get())
        }
        release {
            buildConfigField 'String', 'SIGNALING_SERVER_URL',
                groovy.json.JsonOutput.toJson(releaseSignalingUrl.get())
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    sourceSets {
        test {
            resources.srcDir('../../protocol/fixtures')
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register('validateReleaseSignalingUrl') {
    doLast {
        def address = releaseSignalingUrl.get()
        def uri
        try {
            uri = new java.net.URI(address)
        } catch (java.net.URISyntaxException ignored) {
            uri = null
        }
        if (uri?.scheme?.toLowerCase(java.util.Locale.ROOT) != 'wss' ||
            !uri.host || uri.rawUserInfo || uri.rawQuery || uri.rawFragment ||
            uri.port == 0 || uri.port > 65535) {
            throw new GradleException(
                'Set -PreleaseSignalingUrl=wss://your-domain.example/signaling/ before building a release'
            )
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('validateReleaseSignalingUrl')
}